[project]
name = "grounded-docs-qa"
version = "0.1.0"
description = "Question answering over versioned PostgreSQL docs with hybrid retrieval, reranking and enforced citations"
readme = "README.md"
authors = [
    { name = "Sunny Patel", email = "sunnypatel2048@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "beautifulsoup4>=4.13",
    "llm-lab @ git+https://github.com/sunnypatel2048/llm-lab@v0.1.0",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.2",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
]

[project.scripts]
docs-qa = "docs_qa.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "docs_qa"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]
# The embedding model (torch is large). Installed locally by default; CI leaves it out.
embed = [
    "torch",
    "transformers",
]

[tool.uv]
default-groups = ["dev", "embed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (TEST_DATABASE_URL); skipped when none is reachable"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
